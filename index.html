<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/hull.js@1.0.6/dist/hull.js"></script>

<script>
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SITE=location.origin+location.pathname;
const EVENT={datum:"Zaterdag 31 oktober",tijd:"17:00 – 20:00",postcodes:[]};
const TYPES={aanbellen:["🎃","Aanbellen","Hier kun je aanbellen"],bak:["🍬","Snoepbak","Bak snoep staat buiten"],spookhuis:["👻","Spookhuis","Een beetje griezelig"],eng:["💀","Eng spookhuis","Alleen voor durfals!"]};
const DOET=h=>{const d=h.doet&&h.doet.length?h.doet:[{snoep:"aanbellen",versierd:"aanbellen"}[h.type]||h.type];return Object.keys(TYPES).filter(k=>d.includes(k))};
const prim=h=>{const d=DOET(h);return TYPES[["eng","spookhuis","aanbellen","bak"].find(k=>d.includes(k))||"aanbellen"][0]};
const doetTxt=h=>{const d=DOET(h);return [...d.map(k=>TYPES[k][0]+" "+TYPES[k][1]),...(d.includes("aanbellen")||d.includes("bak")?[]:["🚫 Geen snoep"])].join(" · ")};
const RUIL={spookhuis:"eng",eng:"spookhuis",aanbellen:"bak",bak:"aanbellen"};
const doetIco=h=>DOET(h).map(k=>TYPES[k][0]).join("");
const hm=t=>(t||"").slice(0,5);
const DAGF=new Intl.DateTimeFormat("nl-NL",{weekday:"long",day:"numeric",month:"long"});
function dagTxt(d){if(!d)return "";const s=DAGF.format(new Date(d+"T12:00"));return s[0].toUpperCase()+s.slice(1)}
function tijdTxt(v,t){return v?hm(v)+(t?" – "+hm(t):""):""}
function wanneer(){return EVENT.datum?esc(EVENT.datum)+(EVENT.tijd?" · "+esc(EVENT.tijd):""):"Datum volgt"}
function deadline(){if(!EVENT.dag)return null;const d=new Date(EVENT.dag+"T12:00");d.setDate(d.getDate()-3);return d}
function aanmeldenDicht(){const d=deadline();if(!d)return false;const t=new Date();t.setHours(12,0,0,0);return t>d}
function dlTxt(){const d=deadline();if(!d)return "";const s=DAGF.format(d);return aanmeldenDicht()?"Aanmelden is gesloten.":"Huis aanmelden kan t/m "+s+"."}
function agendaHTML(){return EVENT.dag?`<div class="agbtn"><button data-ics>📅 Zet in agenda</button><a target="_blank" rel="noopener" href="${gcal()}">Google Agenda</a></div>`:""}

  const mk=L.marker([l.lat,l.lng],{zIndexOffset:v?-500:0,icon:L.divIcon({className:"",html:`<div class="mk ${hl==h.adres?"hl":""} ${v?"vis":""}"><span>${prim(h)}</span>${v?"<i>✓</i>":""}</div>`,iconSize:[36,36],iconAnchor:[18,18]})}).addTo(m);
  mk.on("click",()=>{sheet(h.adres);m.panTo([l.lat,l.lng])})});
}
function voortgang(){const g=geweest(),t=huizen.length,n=huizen.filter(h=>g.has(h.adres)).length;
 return{n,t,html:t?`<div class="prog"><div class="pt"><b>${n==t?"🎉 Alles gehad!":"🍬 "+n+" van "+t+" bezocht"}</b>${n?`<button class="lnk" data-reset>Opnieuw</button>`:""}</div><div class="bar"><i style="width:${n/t*100}%"></i></div><label class="tg"><input type="checkbox" data-verberg ${VERBERG?"checked":""}> Verberg huizen waar ik al was</label></div>`:""}}
function lijstHTML(){const g=geweest();const rows=sorted().sort((a,b)=>g.has(a.adres)-g.has(b.adres));
 return `${voortgang().html}<div class="list">${rows.map(h=>{const v=g.has(h.adres);return `<div class="row ${v?"vis":""}" data-h="${esc(h.adres)}"><span class="e">${v?"✅":prim(h)}</span><span class="t">${esc(h.adres)}<small>${v?"Geweest · ":""}${doetTxt(h)}${h.extra.length?" · "+h.extra.map(esc).join(" · "):""}</small></span><span style="color:var(--mu)">›</span></div>`}).join("")||'<div class="empty">Nog niemand. Wees de eerste! <a href="#/meedoen" style="color:var(--or)">Doe mee</a></div>'}</div>
 <div class="legend" style="margin-top:12px">${Object.values(TYPES).map(([e,t])=>`<span>${e} ${t}</span>`).join("")}<span>✅ Geweest</span></div>`}
function herteken(){if(!MAP||(location.hash||"").slice(2).split("?")[0]!="kaart")return;const c=MAP.getCenter(),z=MAP.getZoom(),open=$("#dr")?.classList.contains("open");kaart();MAP.setView(c,z);if(open)$("#dr").classList.add("open")}

 app.innerHTML=`<div class="kp"><aside class="side"><div class="top"><h1 style="font-size:30px">Spookykaart</h1><p class="m" style="margin:4px 0 0">${huizen.length} huizen doen mee · ${wanneer()}</p>${EVENT.mededeling?`<div class="note">📢 ${esc(EVENT.mededeling)}</div>`:""}</div><div class="bd">${lijstHTML()}</div></aside>
 <div class="map" id="mw"><div class="lmap" id="lmap"></div>
 <div class="drawer" id="dr"><div class="hd"><b>👻 ${huizen.length} huizen${vg.n?` · ✅ ${vg.n} bezocht`:" doen mee"}</b><small>Tik om de lijst te openen</small></div><div class="bd">${EVENT.mededeling?`<div class="note" style="margin:0 0 10px">📢 ${esc(EVENT.mededeling)}</div>`:""}${lijstHTML()}</div></div></div></div>`;
 const m=basis($("#lmap"));pins(m);
 const lay=knoppen($("#mw"),62);lay.querySelectorAll("button").forEach(b=>b.onclick=()=>{LAYER=b.dataset.l;try{localStorage.setItem("laag",LAYER)}catch(e){}const c=m.getCenter(),z=m.getZoom();kaart();MAP.setView(c,z)});
 const dr=$("#dr");dr.querySelector(".hd").onclick=()=>{dr.classList.toggle("open");dr.querySelector(".hd small").textContent=dr.classList.contains("open")?"Tik om te sluiten":"Tik om de lijst te openen"};
 app.querySelectorAll(".row[data-h]").forEach(r=>r.onclick=()=>{const l=lot(r.dataset.h);dr.classList.remove("open");if(l)MAP.flyTo([l.lat,l.lng],19,{duration:.8});sheet(r.dataset.h)});

function sheet(a){$(".sheet")?.remove();const h=huizen.find(x=>x.adres==a);if(!h)return;const l=lot(a);const v=geweest().has(a);const d=document.createElement("div");d.className="sheet";
 d.innerHTML=`<button class="x" aria-label="Sluiten">✕</button><h3>${prim(h)} ${esc(h.adres)}</h3><div style="color:#4d4060">${doetTxt(h)}${v?" · ✅ geweest":""}</div>${h.extra.length?`<p>⭐ ${h.extra.map(esc).join(" · ")}</p>`:""}
 <div class="sbtn"><button class="btn ${v?"zacht":"okb"}" data-gw>${v?"↩️ Toch niet geweest":"✅ Hier geweest!"}</button>${l&&!v?`<button class="btn" data-loop>🚶 Loop hierheen</button>`:""}</div>`;
 document.body.append(d);d.querySelector(".x").onclick=()=>d.remove();
 d.querySelector("[data-gw]").onclick=()=>{zetGeweest(a,!v);d.remove();stopRoute();herteken()};
 const lb=d.querySelector("[data-loop]");if(lb)lb.onclick=()=>{d.remove();looproute(a)}}
let RLIJN=null;
function stopRoute(){if(RLIJN){RLIJN.remove();RLIJN=null}$(".rbar")?.remove()}
function hier(){return new Promise((ok,nee)=>{if(ME)return ok(ME.getLatLng());if(!navigator.geolocation)return nee("geen");navigator.geolocation.getCurrentPosition(p=>ok(L.latLng(p.coords.latitude,p.coords.longitude)),()=>nee("geweigerd"),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})})}
async function looproute(a){
 const l=lot(a);if(!l||!MAP)return;stopRoute();const doel=L.latLng(l.lat,l.lng),gm=`https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${l.lat},${l.lng}`;
 const wrap=$("#lmap").parentElement,bar=document.createElement("div");bar.className="rbar";bar.innerHTML=`<span style="font-size:26px">🚶</span><div><b>Route zoeken…</b><small>${esc(a)}</small></div><button class="x" aria-label="Route sluiten">✕</button>`;wrap.append(bar);
 bar.querySelector(".x").onclick=stopRoute;
 const zet=(html)=>{bar.querySelector("div").innerHTML=html};
 let van;try{van=await hier()}catch(e){zet(`<b>Waar ben je?</b><small>Sta locatie toe om de route te zien, of <a href="${gm}" target="_blank" rel="noopener">open Google Maps</a>.</small>`);return}
 if(!$(".ctl [data-c=gps]").classList.contains("on"))gps($(".ctl [data-c=gps]"));
 if(van.distanceTo(doel)>4000){zet(`<b>Je bent niet in de buurt</b><small>Ga eerst naar De Eilanden / Dichtersbuurt, of <a href="${gm}" target="_blank" rel="noopener">open Google Maps</a>.</small>`);return}
 let pts=null,m=van.distanceTo(doel)*1.3,sec=null;
 try{const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${van.lng},${van.lat};${l.lng},${l.lat}?overview=full&geometries=geojson`);const j=await r.json();
  if(j.routes&&j.routes[0]){pts=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);m=j.routes[0].distance}}catch(e){}
 const min=Math.max(1,Math.round(m/75));
 RLIJN=L.layerGroup([L.polyline(pts||[van,doel],{color:"#16101f",weight:9,opacity:.5}),L.polyline(pts||[van,doel],{color:"#ff7a1a",weight:5,dashArray:pts?null:"8 8"})]).addTo(MAP);
 MAP.fitBounds(L.latLngBounds(pts||[van,doel]).extend(doel),{padding:[70,40],maxZoom:19});
 zet(`<b>${min} min lopen · ${m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km"}</b><small>naar ${esc(a)}${pts?"":" (hemelsbreed)"} · <a href="${gm}" target="_blank" rel="noopener">Google Maps</a></small>`);
}

 const sat=LAYER=="sat";POLY={};

 LOTS.forEach(l=>{const r=L.polygon(l.p,stijl(l.a)).addTo(m);POLY[l.a]=r;
  r.bindTooltip(l.a.match(/\d+[A-Za-z]?/)[0],{permanent:true,direction:"center",className:"num"});r.on("click",()=>kies(l.a))});
 const el=$("#lmap");const upd=()=>el.classList.toggle("hidenum",m.getZoom()<17.5);m.on("zoomend",upd);upd();

// ---- Datumprikker ----
function tok(){let t="";try{t=localStorage.getItem("stemtoken")||""}catch(e){}if(!/^[a-f0-9]{32}$/.test(t)){t=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("stemtoken",t)}catch(e){}}return t}
function optDag(x){return x.dag?dagTxt(x.dag):esc(x.label)}
function optTijd(x){return x.van?tijdTxt(x.van,x.tot)+" uur":""}
function voorbij(x){return x.dag&&x.dag<new Date().toISOString().slice(0,10)}
const KEUZES=[["ja","✅","Kan ik"],["misschien","🤔","Misschien"],["nee","❌","Kan niet"]];
async function datum(){
 app.className="";
 app.innerHTML=`<h2>📅 Welke dag past?</h2><div id="pk2" class="empty">Laden…</div>`;
 let o=[],st=[];try{[o,st]=await Promise.all([get("prikker_opties?select=*&order=dag,van,volgorde"),rpc("prikker_stand",{p_token:tok()})])}catch(e){$("#pk2").textContent="Kon de datumprikker niet laden. Probeer het later opnieuw.";return}
 const S={};(st||[]).forEach(s=>S[s.optie_id]=s);
 const open=EVENT.prikker!==false;
 const teken=()=>{
  const rows=o.map(x=>({x,s:S[x.id]||{ja:0,misschien:0,nee:0,mijn:null}}));
  const score=r=>r.s.ja*2+r.s.misschien, top=Math.max(0,...rows.map(score));
  const klaar=rows.filter(r=>r.s.mijn).length;
  $("#pk").innerHTML=`${!open?`<div class="pinfo">${EVENT.datum?`🎃 <b>De datum staat vast: ${esc(EVENT.datum)}${EVENT.tijd?" · "+esc(EVENT.tijd):""}</b>`:"🔒 De datumprikker is gesloten."}${agendaHTML()}<small>Hieronder zie je hoe er gestemd is.</small></div>`
   :`<div class="pinfo">Tik per dag aan of je kunt. Je stem is <b>anoniem</b> en je kunt hem altijd aanpassen.<br><small>${klaar?`✔️ Je hebt ${klaar} van de ${rows.length} dagen ingevuld.`:"Je hebt nog niet gestemd."}</small></div>`}
  ${rows.map(({x,s})=>{const n=s.ja+s.misschien+s.nee,lead=top>0&&score({s})==top,oud=voorbij(x);
   return `<div class="popt ${lead?"lead":""} ${oud?"oud":""}">
    <div class="ph"><div><b>${optDag(x)}</b>${optTijd(x)?`<small>🕖 ${optTijd(x)}</small>`:""}</div>${lead?`<span class="badge">⭐ ${open?"Favoriet":"Meeste stemmen"}</span>`:""}</div>
    <div class="pbar">${n?`<i class="j" style="flex:${s.ja}"></i><i class="m" style="flex:${s.misschien}"></i><i class="n" style="flex:${s.nee}"></i>`:""}</div>
    <div class="pcnt"><span>✅ ${s.ja} kan</span><span>🤔 ${s.misschien} misschien</span><span>❌ ${s.nee} kan niet</span></div>
    ${open&&!oud?`<div class="pk3">${KEUZES.map(([k,e,t])=>`<button class="pkb ${k} ${s.mijn==k?"on":""}" data-o="${x.id}" data-k="${k}" aria-pressed="${s.mijn==k}"><span>${e}</span>${t}</button>`).join("")}</div>`:""}
   </div>`}).join("")||'<div class="empty">Er zijn nog geen datums om uit te kiezen.</div>'}
  <div class="err" id="err"></div>`;
  bindAgenda();
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{
   const id=b.dataset.o,k=b.dataset.k,s=S[id]||(S[id]={ja:0,misschien:0,nee:0,mijn:null}),oud=s.mijn,nieuw=oud==k?null:k;
   if(oud)s[oud]--;if(nieuw)s[nieuw]++;s.mijn=nieuw;teken();
   try{await rpc("stem",{p_optie:id,p_token:tok(),p_keuze:nieuw});toast(nieuw?"Opgeslagen ✓":"Stem weggehaald")}
   catch(m){if(nieuw)s[nieuw]--;if(oud)s[oud]++;s.mijn=oud;teken();$("#err").textContent=m}});
 };
 $("#pk2").outerHTML=`<div id="pk"></div>`;teken();
}

 const [o,st]=await Promise.all([get("prikker_opties?select=*&order=dag,van,volgorde"),rpc("prikker_stand",{})]);
 const nieuw=lijst.filter(h=>!h.goedgekeurd),ok=lijst.filter(h=>h.goedgekeurd);
 const rij=h=>`<div class="row" style="flex-wrap:wrap;cursor:default"><span class="e">${prim(h)}</span><span class="t">${esc(h.adres)}<small>${doetTxt(h)}${h.extra.length?" · "+h.extra.map(esc).join(" · "):""}</small></span>
  <span class="chips">${h.goedgekeurd?`<button class="chip" data-a="afkeuren" data-id="${h.id}">Verbergen</button>`:`<button class="chip on" data-a="goedkeuren" data-id="${h.id}">✓ Goedkeuren</button>`}
  ${Object.entries(TYPES).map(([t,[e,n]])=>`<button class="chip ${DOET(h).includes(t)?"on":""}" data-doet="${t}" data-hid="${h.id}" title="${n}">${e}</button>`).join("")}
  <button class="chip" data-a="verwijderen" data-id="${h.id}">🗑️</button></span></div>`;
 app.innerHTML=`<h2>🔧 Beheer</h2>
 <div class="stat"><div><b>${nieuw.length}</b><small>te controleren</small></div><div><b>${ok.length}</b><small>op de kaart</small></div><div><b>${LOTS.length}</b><small>adressen in gebied</small></div></div>
 <h2>Nieuw (${nieuw.length})</h2><div class="list">${nieuw.map(rij).join("")||'<div class="empty">Niets te controleren.</div>'}</div>
 <h2>Op de kaart (${ok.length})</h2><div class="list">${ok.map(rij).join("")||'<div class="empty">Nog niets.</div>'}</div>
 <h2>✏️ Rand van het gebied</h2><p class="m"><b>Sleep</b> de paarse bolletjes om de rand te verplaatsen. <b>Tik op de kaart</b> om een punt toe te voegen, <b>tik op een bolletje</b> om het weg te halen. Oranje = adressen uit je postcodes.</p><div class="chips" style="margin:10px 0"><button class="chip on" id="rsave">💾 Rand opslaan</button><button class="chip" id="rleeg">✏️ Opnieuw tekenen</button><button class="chip" id="rauto">🔄 Automatisch</button></div><div id="rinfo" class="m" style="margin:0 0 8px"></div><div style="height:62vh;position:relative;border-radius:18px;overflow:hidden"><div class="lmap" id="rmap"></div></div>
 <h2>📍 Gebied (postcodes)</h2><p class="m">Alle adressen met deze postcodes kunnen meedoen. Zoek postcodes op via de <a href="https://allecijfers.nl/postcodekaart/?lon=4.4921&lat=51.9861&zoom=16" target="_blank" style="color:var(--or)">postcodekaart</a>.</p><textarea id="bpc" rows="4">${esc((EVENT.postcodes||[]).join(", "))}</textarea><button class="btn ghost" id="bpcs">Gebied opslaan</button>
 <h2>🏠 Losse huizen</h2><p class="m">Huizen net buiten de postcodes. Eén per regel: postcode + huisnummer, bijv. <b>2661HE 51</b>.</p><textarea id="blo" rows="3">${esc((EVENT.losse||[]).join("\n"))}</textarea><button class="btn ghost" id="blos">Losse huizen opslaan</button>
 <h2>Evenement</h2><p class="m">Vul de definitieve datum in, of kies hieronder een datum uit de prikker. Aanmelden sluit dan automatisch 3 dagen ervoor.</p>
 <div class="tr3"><label>Datum<input type="date" id="bdag" value="${EVENT.dag||""}"></label><label>Van<input type="time" id="bvan" value="${hm(EVENT.van)}"></label><label>Tot<input type="time" id="btot" value="${hm(EVENT.tot)}"></label></div>
 <input id="bm" value="${esc(EVENT.mededeling||"")}" placeholder="Mededeling (optioneel)">
 <div class="chips" style="margin-top:10px"><button class="chip ${EVENT.prikker!==false?"on":""}" id="bp">📅 Datumprikker open</button></div>
 <button class="btn" id="bs">Opslaan</button>
 <h2>Datumprikker</h2><div class="list">${o.map(x=>{const c=st.find(v=>v.optie_id==x.id)||{ja:0,misschien:0,nee:0};return `<div class="row" style="cursor:default;flex-wrap:wrap"><span class="t">${x.dag?dagTxt(x.dag)+" · "+tijdTxt(x.van,x.tot):esc(x.label)}<small>✅ ${c.ja} · 🤔 ${c.misschien} · ❌ ${c.nee}</small></span><span class="chips">${x.dag?`<button class="chip" data-kies="${x.id}">📌 Deze kiezen</button>`:""}<button class="chip" data-del="${x.id}">🗑️</button></span></div>`}).join("")||'<div class="empty">Nog geen datums.</div>'}</div>
 <div class="tr3"><label>Datum<input type="date" id="odag"></label><label>Van<input type="time" id="ovan" value="17:00"></label><label>Tot<input type="time" id="otot" value="20:00"></label></div><button class="btn ghost" id="bad">Datum toevoegen</button><div class="err" id="err"></div>`;
 const doe=async(f,b)=>{try{await rpc(f,{p_key:k,...b});await laad();beheer()}catch(m){$("#err").textContent=m}};
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(b.dataset.a=="verwijderen"&&!confirm("Verwijderen?"))return;doe("beheer_huis",{p_id:b.dataset.id,p_actie:b.dataset.a})});
 app.querySelectorAll("[data-doet]").forEach(b=>b.onclick=()=>{const h=lijst.find(x=>x.id==b.dataset.hid),d=DOET(h),k=b.dataset.doet,n=d.includes(k)?d.filter(x=>x!=k):[...d.filter(x=>x!=RUIL[k]),k];if(!n.length)return $("#err").textContent="Minstens één ding aan laten.";doe("beheer_huis",{p_id:h.id,p_actie:"bewerken",p_doet:n})});
 const bewaar=(dag,van,tot,open)=>doe("beheer_instellingen",{p_datum:dag?dagTxt(dag):"",p_tijd:tijdTxt(van,tot),p_mededeling:$("#bm").value,p_prikker_open:open,p_dag:dag||null,p_van:van||null,p_tot:tot||null});
 app.querySelectorAll("[data-kies]").forEach(b=>b.onclick=()=>{const x=o.find(q=>q.id==b.dataset.kies);if(confirm(`${dagTxt(x.dag)} vastzetten als Halloween-datum en de datumprikker sluiten?`))bewaar(x.dag,hm(x.van),hm(x.tot),false)});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>doe("beheer_optie",{p_label:"",p_verwijder:b.dataset.del}));
 $("#bp").onclick=()=>$("#bp").classList.toggle("on");randEditor(k);
 $("#bpcs").onclick=async()=>{const l=$("#bpc").value.toUpperCase().split(/[\s,;]+/).map(x=>x.trim()).filter(x=>/^\d{4}[A-Z]{2}$/.test(x));try{$("#bpcs").textContent="Laden…";await rpc("beheer_postcodes",{p_key:k,p_postcodes:l});await laad();await laadGebied(EVENT.postcodes,EVENT.losse);beheer()}catch(m){$("#err").textContent=m}};
 $("#blos").onclick=async()=>{const l=$("#blo").value.toUpperCase().split(/[,;\n]+/).map(x=>x.trim().replace(/^(\d{4})\s*([A-Z]{2})\s+/,"$1$2 ")).filter(x=>/^\d{4}[A-Z]{2} \d+[A-Z]?(-[A-Z0-9]+)?$/.test(x));try{$("#blos").textContent="Laden…";await rpc("beheer_losse",{p_key:k,p_losse:l});await laad();await laadGebied(EVENT.postcodes,EVENT.losse);beheer()}catch(m){$("#err").textContent=m}};
 $("#bs").onclick=()=>bewaar($("#bdag").value,$("#bvan").value,$("#btot").value,$("#bp").classList.contains("on"));
 $("#bad").onclick=()=>{const d=$("#odag").value;if(!d)return $("#err").textContent="Kies eerst een datum.";doe("beheer_optie",{p_label:dagTxt(d)+" "+tijdTxt($("#ovan").value,$("#otot").value),p_dag:d,p_van:$("#ovan").value||null,p_tot:$("#otot").value||null})};
}

function route(){$(".sheet")?.remove();document.body.dataset.p=(location.hash||"#/").slice(2).split("?")[0];if(!$(".pagebg"))document.body.insertAdjacentHTML("afterbegin",'<div class="pagebg" aria-hidden="true"></div>');const dt=$(".tabs a[data-t=datum]");if(dt)dt.hidden=EVENT.prikker===false;RLIJN=null;if(MAP){MAP.remove();MAP=null}if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}
 const p=(location.hash||"#/").slice(2).split("?")[0];
 document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t==p));
 ({kaart,meedoen,flyer,datum,beheer}[p]||start)();scrollTo(0,0)}
addEventListener("hashchange",route);
app.innerHTML='<div class="empty" style="padding-top:30vh">🎃 Laden…</div>';
laad().then(()=>laadGebied(EVENT.postcodes||[],EVENT.losse||[])).catch(e=>console.log(e)).then(route);
</script></body></html>
