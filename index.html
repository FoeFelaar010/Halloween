<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween in de buurt</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#16101f;--card:#221a2e;--line:#352a45;--or:#ff7a1a;--tx:#f5f1fa;--mu:#a99bbd;--ok:#2fbf6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif;padding-bottom:84px}
header{padding:20px 16px 8px;text-align:center}
h1{font-family:Creepster,cursive;font-weight:400;color:var(--or);font-size:34px;margin:0;letter-spacing:1px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:8px 16px 24px}
h2{font-size:20px;margin:16px 0 4px}p.m{color:var(--mu);margin:0 0 12px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1d1528ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs a{flex:1;text-align:center;color:var(--mu);text-decoration:none;font-size:12px;font-weight:600;padding:6px 0;border-radius:12px}
.tabs a b{display:block;font-size:22px;line-height:1.2}
.tabs a.on{color:var(--tx);background:var(--card)}
.frame{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin:12px 0;position:relative}
.lmap{height:62vh;min-height:380px;background:#c8e6c0}
.leaflet-container{font-family:Inter,system-ui,sans-serif}
.lay{position:absolute;top:10px;right:10px;z-index:500;display:flex;background:#fff;border-radius:12px;box-shadow:0 2px 8px #0004;overflow:hidden}
.lay button{border:0;background:#fff;color:#3c4043;font:600 13px Inter,sans-serif;padding:9px 12px;cursor:pointer}.lay button.on{background:#e8f0fe;color:#1a73e8}
.mk{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;box-shadow:0 2px 6px #0007;border:2.5px solid var(--or)}
.mk.hl{transform:scale(1.35);box-shadow:0 0 0 6px #ff7a1a77,0 2px 6px #0007}
.num{background:none;border:0;box-shadow:none;color:#3c4043;font:700 11px Inter,sans-serif;text-shadow:0 0 3px #fff,0 0 3px #fff;padding:0}
.num:before{display:none}
.sat .num{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.hidenum .num{display:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:0 2px 8px #000a;border:2px solid var(--or);cursor:pointer}
.mk.hl{width:40px;height:40px;font-size:22px;z-index:3;box-shadow:0 0 0 5px #ff7a1a88,0 2px 8px #000a}
.lot{position:absolute;box-shadow:inset 0 0 0 1.5px #fff;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px Inter,sans-serif;line-height:1;text-shadow:0 0 3px #000,0 0 3px #000;cursor:pointer}
.lot.taken{background:#ff7a1acc;color:#16101f;text-shadow:none;cursor:default}
.lot.sel{background:var(--ok);box-shadow:inset 0 0 0 2px #fff,0 0 0 3px var(--ok);z-index:2}
.legend{display:flex;gap:14px;justify-content:center;color:var(--mu);font-size:14px;flex-wrap:wrap}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.row:first-child{border-top:0}.row .e{font-size:24px;width:30px;text-align:center}.row .t{flex:1}.row small{display:block;color:var(--mu);font-size:13px}
.empty{color:var(--mu);text-align:center;padding:24px}
.step{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:700}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--or);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px}
.picked{background:var(--card);border-radius:14px;padding:14px 16px;font-weight:600;min-height:52px}
.picked.ok{background:var(--ok);color:#06210f}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:2px solid transparent;border-radius:16px;padding:16px 4px;text-align:center;color:var(--tx);font:600 14px Inter,sans-serif;cursor:pointer}
.tile b{display:block;font-size:30px;line-height:1.3}.tile.on{border-color:var(--or);background:#3a2410}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid transparent;color:var(--tx);border-radius:999px;padding:10px 14px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--or);background:#3a2410}
input{width:100%;background:var(--card);border:2px solid transparent;color:var(--tx);border-radius:14px;padding:14px 16px;font:16px Inter,sans-serif;margin-top:8px;outline:none}
input:focus{border-color:var(--or)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--or);color:#1a0e00;font:700 17px Inter,sans-serif;padding:17px;margin-top:22px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--tx)}
.err{color:#ff8a80;font-size:14px;margin-top:8px;min-height:20px}
.done{text-align:center;padding:30px 8px}.done b{font-size:64px;display:block}
.sheet{position:fixed;left:12px;right:12px;bottom:92px;max-width:536px;margin:auto;background:#fff;color:#1d1528;border-radius:20px;padding:16px 18px;box-shadow:0 10px 40px #000c;z-index:6}
.sheet h3{margin:0 0 4px;font-size:18px}.sheet .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;padding:6px}
.sheet p{margin:6px 0 0;color:#4d4060}
/* flyer */
.flyer{background:#16101f;border-radius:16px;padding:18px;border:1px solid var(--line)}
.flyer h1{font-size:40px;text-align:center}
.fl{columns:2;column-gap:16px;font-size:14px;margin:0;padding-left:20px}.fl li{margin:3px 0;break-inside:avoid}
@media print{.tabs,.noprint{display:none!important}body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}main{max-width:none}}
@media (min-width:900px){body{padding:64px 0 0}.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:8px;padding:8px}.tabs a{flex:0 0 130px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}.tabs a b{font-size:18px}main{max-width:1100px}.lmap{height:72vh}.list{display:grid;grid-template-columns:repeat(2,1fr)}.list .row{border-top:1px solid var(--line)}.sheet{bottom:24px}h1{font-size:44px}}
@media print{.tabs{display:none!important}}
</style></head><body>
<header><h1>Halloween in de buurt</h1><div class="sub">De Eilanden &amp; Dichtersbuurt</div><div class="sub" id="datum"></div></header>
<main id="app"></main>
<nav class="tabs"><a href="#/" data-t=""><b>🗺️</b>Kaart</a><a href="#/meedoen" data-t="meedoen"><b>🎃</b>Meedoen</a><a href="#/datum" data-t="datum"><b>📅</b>Datum</a><a href="#/flyer" data-t="flyer"><b>🖨️</b>Flyer</a></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const MW=1800,MH=1600;
let LOTS=[];
// ---- Gebied: alle adressen van de gekozen postcodes (BAG) + kadastrale percelen (PDOK, geen account) ----
const sq=(lat,lng)=>[[lat+3e-5,lng-4.5e-5],[lat+3e-5,lng+4.5e-5],[lat-3e-5,lng+4.5e-5],[lat-3e-5,lng-4.5e-5]];
async function laadGebied(pcs){
 const key="gebied:"+pcs.join(",");try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<7*864e5){LOTS=c.d.map(([a,lat,lng,p])=>({a,w:1,cx:lat,cy:lng,p:p||sq(lat,lng)}));return}}catch(e){}
 const adr=[];await Promise.all(pcs.map(async pc=>{const r=await fetch("https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?fq=type:adres&rows=100&fl=straatnaam,huisnummer,huisletter,huisnummertoevoeging,centroide_ll&q=*:*&fq=postcode:"+pc);const j=await r.json();
  for(const d of j.response.docs){const m=d.centroide_ll.match(/POINT\(([\d.]+) ([\d.]+)\)/);adr.push({a:d.straatnaam+" "+d.huisnummer+(d.huisletter||"")+(d.huisnummertoevoeging?"-"+d.huisnummertoevoeging:""),lng:+m[1],lat:+m[2]})}}));
 if(!adr.length){LOTS=[];return}
 const la=adr.map(a=>a.lat),lo=adr.map(a=>a.lng);
 const bb=[Math.min(...la)-3e-4,Math.min(...lo)-4e-4,Math.max(...la)+3e-4,Math.max(...lo)+4e-4].map(v=>v.toFixed(6)).join(",");
 let P=[];try{const r=await fetch("https://service.pdok.nl/kadaster/kadastralekaart/wfs/v5_0?service=WFS&version=2.0.0&request=GetFeature&typeNames=kadastralekaart:Perceel&outputFormat=application/json&srsName=urn:ogc:def:crs:EPSG::4326&count=5000&bbox="+bb+",urn:ogc:def:crs:EPSG::4326");P=(await r.json()).features.filter(f=>f.geometry.type=="Polygon").map(f=>({id:f.id,g:f.geometry.coordinates[0]}))}catch(e){console.log(e)}
 const ins=(x,y,g)=>{let c=false;for(let i=0,j=g.length-1;i<g.length;j=i++){const a=g[i],b=g[j];if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c}return c};
 const cnt=new Map();for(const a of adr){a.p=P.find(q=>ins(a.lng,a.lat,q.g));if(a.p)cnt.set(a.p.id,(cnt.get(a.p.id)||0)+1)}
 const seen=new Set(),d=[];for(const a of adr){if(seen.has(a.a))continue;seen.add(a.a);let poly=0;if(a.p&&cnt.get(a.p.id)==1){let g=a.p.g.slice(0,-1);if(g.length>40)g=g.filter((_,i)=>i%Math.ceil(g.length/40)==0);poly=g.map(q=>[+q[1].toFixed(6),+q[0].toFixed(6)])}d.push([a.a,+a.lat.toFixed(6),+a.lng.toFixed(6),poly])}
 try{for(const k of Object.keys(localStorage))if(k.startsWith("gebied:"))localStorage.removeItem(k);localStorage.setItem(key,JSON.stringify({t:Date.now(),d}))}catch(e){}
 LOTS=d.map(([a,lat,lng,p])=>({a,w:1,cx:lat,cy:lng,p:p||sq(lat,lng)}));
}
let LAYER="kaart",MAP=null;
const EVENT={datum:"Zaterdag 31 oktober",tijd:"17:00 – 20:00"};
const TYPES={snoep:["🍬","Snoep"],spookhuis:["👻","Spookhuis"],versierd:["🎃","Versierd"]};
const EXTRA=["🍭 Suikerspin","🔥 Marshmallows","🍫 Chocomel","📸 Fotohoekje","🎶 Muziek","🎭 Schminken"];
// Demo-data (later: database)
let huizen=[];
// ---- Database (Supabase, geen account nodig voor bewoners) ----
const SB="https://vmlkwcndbdpmdjalhjjz.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtbGt3Y25kYmRwbWRqYWxoamp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTk2NDIsImV4cCI6MjEwOTEzNTY0Mn0.GQjQ9S_tqE_7PFgMmSHuoB8RNX1Wd8nEW9x90EifDV8";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
async function get(t){const r=await fetch(SB+"/rest/v1/"+t,{headers:H});if(!r.ok)throw await r.text();return r.json()}
async function rpc(f,b){const r=await fetch(SB+"/rest/v1/rpc/"+f,{method:"POST",headers:H,body:JSON.stringify(b)});if(!r.ok){let m="Er ging iets mis";try{m=(await r.json()).message||m}catch(e){}throw m}const t=await r.text();return t?JSON.parse(t):null}
async function laad(){try{const [a,i]=await Promise.all([get("aanmeldingen?select=adres,type,extra"),get("instellingen?select=*")]);huizen=a;if(i[0]){EVENT.datum=i[0].datum;EVENT.tijd=i[0].tijd;EVENT.mededeling=i[0].mededeling;EVENT.prikker=i[0].prikker_open;EVENT.postcodes=i[0].postcodes||[]}$("#datum").textContent=`${EVENT.datum} · ${EVENT.tijd}`}catch(e){console.log(e)}}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lot=a=>LOTS.find(l=>l.a==a);
const sortKey=a=>{const m=a.match(/^(.*?) (\d+)/);return m?[m[1]=="De Eilanden"?"":m[1],+m[2]]:[a,0]};
const sorted=()=>[...huizen].sort((a,b)=>{const x=sortKey(a.adres),y=sortKey(b.adres);return x[0].localeCompare(y[0])||x[1]-y[1]});
$("#datum").textContent=`${EVENT.datum} · ${EVENT.tijd}`;

function kaartHTML(){return `<div class="frame"><div class="lay"><button data-l="kaart" class="${LAYER=="kaart"?"on":""}">Kaart</button>${GEO?`<button data-l="sat" class="${LAYER=="sat"?"on":""}">Satelliet</button>`:""}</div><div class="lmap" id="lmap"></div></div>`}
const P=(x,y)=>[-y,x];
// ---- Georeferentie: echte kaart via OpenStreetMap (geen account/sleutel) ----
const PLAATS="Bergschenhoek";
const ANCHORS={1:["De Eilanden 31","De Eilanden 52","De Eilanden 69"],2:["Brederodestraat 1","Brederodestraat 39","Vondelstraat 2"]};
let GEO={}; // {1:[a,b,c,d,e,f],2:[...]}
function solve3(pts,vals){const[[x1,y1],[x2,y2],[x3,y3]]=pts;const D=x1*(y2-y3)-y1*(x2-x3)+(x2*y3-x3*y2);
 const [v1,v2,v3]=vals;return[(v1*(y2-y3)-y1*(v2-v3)+(v2*y3-v3*y2))/D,(x1*(v2-v3)-v1*(x2-x3)+(x2*v3-x3*v2))/D,(x1*(y2*v3-y3*v2)-y1*(x2*v3-x3*v2)+v1*(x2*y3-x3*y2))/D]}
async function geocode(adres){const u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&street="+encodeURIComponent(adres)+"&city="+PLAATS;
 const r=await fetch(u,{headers:{"Accept-Language":"nl"}});const j=await r.json();if(!j[0])throw adres;return[+j[0].lat,+j[0].lon]}
async function georef(){return true;
 try{const c=JSON.parse(localStorage.getItem("geo-v1")||"null");if(c){GEO=c;return true}}catch(e){}
 try{const out={};for(const w of [1,2]){const pts=[],la=[],lo=[];
   for(const a of ANCHORS[w]){const l=LOTS.find(x=>x.a==a);const g=await geocode(a);pts.push([l.cx,l.cy]);la.push(g[0]);lo.push(g[1]);await new Promise(r=>setTimeout(r,1100))}
   if(Math.max(...la)-Math.min(...la)>0.01||Math.max(...lo)-Math.min(...lo)>0.015)throw "adressen te ver uit elkaar";
   out[w]=[...solve3(pts,la),...solve3(pts,lo)]}
  GEO=out;try{localStorage.setItem("geo-v1",JSON.stringify(out))}catch(e){}return true}catch(e){console.log("Geen echte kaart:",e);return false}}
const G=(w,x,y)=>{return[x,y];const t=GEO[w];return[t[0]*x+t[1]*y+t[2],t[3]*x+t[4]*y+t[5]]};
const proj=(l,x,y)=>GEO?G(l.w,x,y):P(x,y);
function makeMap(pick,hl,onPick){
 if(MAP){MAP.remove();MAP=null}
 const el=$("#lmap");if(!el)return;
 let m;
 if(GEO){
  m=L.map(el,{zoomSnap:0.5,maxZoom:20,tap:true});
  (LAYER=="sat"?L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"Esri"}):
   L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap"})).addTo(m);
 }else{
  m=L.map(el,{crs:L.CRS.Simple,minZoom:-3,maxZoom:2,zoomSnap:0.25,attributionControl:false,tap:true});
  el.style.background="#f1efe9";if(!pick)LOTS.forEach(l=>L.polygon(l.p.map(q=>P(q[0],q[1])),{color:"#fff",weight:1,fillColor:"#ddd6c8",fillOpacity:1,interactive:false}).addTo(m));
 }
 MAP=m;el.classList.toggle("sat",LAYER=="sat"&&!!GEO);
 const ll=LOTS.map(l=>[l.cx,l.cy]);
 const w1=ll;
 m.fitBounds(pick?w1:ll,{padding:[10,10]});
 if(!pick&&hl){const l=LOTS.find(l=>l.a==hl);if(l)m.setView(proj(l,l.cx,l.cy),GEO?19:0.5)}
 if(pick){
  const sat=LAYER=="sat"&&GEO;
  LOTS.forEach(l=>{const t=huizen.some(h=>h.adres==l.a),sel=form.a==l.a;
   const r=L.polygon(l.p.map(q=>proj(l,q[0],q[1])),{color:sel?"#2fbf6b":(sat?"#fff":"#7a7f87"),weight:sel?3:1.2,fillColor:sel?"#2fbf6b":(t?"#ff7a1a":"#fff"),fillOpacity:sel?.7:(t?.75:.05),interactive:true}).addTo(m);
   r.bindTooltip(l.a.match(/\d+/)[0],{permanent:true,direction:"center",className:"num"});
   r.on("click",()=>onPick(l.a,t));});
  const upd=()=>el.classList.toggle("hidenum",m.getZoom()<(GEO?17.5:-0.5));m.on("zoomend",upd);upd();
 }else{
  huizen.forEach(h=>{const l=LOTS.find(x=>x.a==h.adres);if(!l)return;
   const mk=L.marker(proj(l,l.cx,l.cy),{icon:L.divIcon({className:"",html:`<div class="mk ${hl==h.adres?"hl":""}">${TYPES[h.type][0]}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}).addTo(m);
   mk.on("click",()=>sheet(h.adres));});
 }
 document.querySelectorAll(".lay button").forEach(b=>b.onclick=()=>{LAYER=b.dataset.l;const c=m.getCenter(),z=m.getZoom();document.querySelectorAll(".lay button").forEach(x=>x.classList.toggle("on",x==b));makeMap(pick,hl,onPick);MAP.setView(c,z)});
}
function kaart(hl){
 app.innerHTML=`${EVENT.mededeling?`<div class="picked" style="margin-top:12px">📢 ${esc(EVENT.mededeling)}</div>`:""}<h2>${huizen.length} huizen doen mee</h2><p class="m">Tik op een huis voor meer info.</p>
 ${kaartHTML()}
 <div class="legend">${Object.values(TYPES).map(([e,t])=>`<span>${e} ${t}</span>`).join("")}</div>
 <h2>Alle adressen</h2><div class="list">${sorted().map(h=>`<div class="row" data-h="${esc(h.adres)}"><span class="e">${TYPES[h.type][0]}</span><span class="t">${esc(h.adres)}<small>${TYPES[h.type][1]}${h.extra.length?" · "+h.extra.map(esc).join(" · "):""}</small></span></div>`).join("")||'<div class="empty">Nog niemand. Wees de eerste!</div>'}</div>
 <a class="btn" href="#/meedoen">🎃 Doe ook mee</a>`;
 makeMap(false,hl);
 app.querySelectorAll(".row").forEach(r=>r.onclick=()=>{kaart(r.dataset.h);$(".frame").scrollIntoView({behavior:"smooth"});sheet(r.dataset.h)});
}
function sheet(a){$(".sheet")?.remove();const h=huizen.find(x=>x.adres==a);const d=document.createElement("div");d.className="sheet";
 d.innerHTML=`<button class="x" aria-label="Sluiten">✕</button><h3>${TYPES[h.type][0]} ${esc(h.adres)}</h3><div>${TYPES[h.type][1]}</div>${h.extra.length?`<p>⭐ ${h.extra.map(esc).join(" · ")}</p>`:""}`;
 document.body.append(d);d.querySelector(".x").onclick=()=>d.remove()}

let form={a:null,type:null,extra:[],eigen:""};
function meedoen(){
 app.innerHTML=`<h2>Doe mee 🎃</h2><p class="m">Drie stappen, klaar in 30 seconden.</p>
 <div class="step"><i>1</i>Tik op jouw huis</div>
 ${kaartHTML()}
 <div class="picked ${form.a?"ok":""}" id="pk">${form.a?"📍 "+esc(form.a):"Nog geen huis gekozen"}</div>
 <div class="step"><i>2</i>Wat doe je?</div>
 <div class="tiles">${Object.entries(TYPES).map(([k,[e,t]])=>`<button class="tile ${form.type==k?"on":""}" data-k="${k}"><b>${e}</b>${t}</button>`).join("")}</div>
 <div class="step"><i>3</i>Iets extra's? <span style="font-weight:400;color:var(--mu)">(mag leeg)</span></div>
 <div class="chips">${EXTRA.map(x=>`<button class="chip ${form.extra.includes(x)?"on":""}" data-x="${x}">${x}</button>`).join("")}</div>
 <input id="eigen" maxlength="40" placeholder="Iets anders, bijv. heksensoep" value="${esc(form.eigen)}">
 <button class="btn" id="go">Aanmelden</button><div class="err" id="err"></div>`;
 const pick=(a,t)=>{if(t){$("#err").textContent=a+" doet al mee.";return}const c=MAP.getCenter(),z=MAP.getZoom();form.a=a;makeMap(true,null,pick);MAP.setView(c,z);const p=$("#pk");p.textContent="📍 "+a;p.classList.add("ok");$("#err").textContent=""};
 makeMap(true,null,pick);
 app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{form.type=b.dataset.k;app.querySelectorAll(".tile").forEach(x=>x.classList.toggle("on",x==b))});
 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const v=b.dataset.x,i=form.extra.indexOf(v);i<0?form.extra.push(v):form.extra.splice(i,1);b.classList.toggle("on")});
 $("#eigen").oninput=e=>form.eigen=e.target.value;
 $("#go").onclick=()=>{
  if(!form.a)return fout("Tik eerst op jouw huis op de kaart.");
  if(!form.type)return fout("Kies wat je doet: snoep, spookhuis of versierd.");
  const extra=[...form.extra,...(form.eigen.trim()?["✨ "+form.eigen.trim()]:[])];
  const a=form.a;$("#go").disabled=true;$("#go").textContent="Bezig…";
  rpc("aanmelden",{p_adres:a,p_type:form.type,p_extra:extra}).then(()=>{form={a:null,type:null,extra:[],eigen:""};
  app.innerHTML=`<div class="done"><b>🎉</b><h2>Top, je doet mee!</h2><p class="m">${esc(a)} is aangemeld. Zodra de organisatie het heeft gecontroleerd, staat je huis op de kaart.</p><a class="btn" href="#/">Bekijk de kaart</a><a class="btn ghost" href="#/flyer">Flyer printen</a></div>`;scrollTo(0,0)}).catch(m=>{fout(m);$("#go").disabled=false;$("#go").textContent="Aanmelden"})};
}
function fout(t){$("#err").textContent=t}

function flyer(){
 app.innerHTML=`<button class="btn noprint" onclick="print()" style="margin:8px 0 16px">🖨️ Print de flyer</button>
 <div class="flyer"><h1>Halloween in de buurt</h1><div class="sub" style="text-align:center">De Eilanden &amp; Dichtersbuurt</div><div class="sub" style="text-align:center;font-size:16px;color:#fff">${EVENT.datum} · ${EVENT.tijd}</div>
 <div class="frame"><div class="lmap" id="lmap" style="height:70vh"></div></div>
 <div class="legend" style="margin-bottom:12px">${Object.values(TYPES).map(([e,t])=>`<span>${e} ${t}</span>`).join("")}</div>
 <ol class="fl">${sorted().map(h=>`<li>${TYPES[h.type][0]} ${esc(h.adres)}${h.extra.length?" "+h.extra.map(x=>x.split(" ")[0]).join(""):""}</li>`).join("")}</ol>
 <p style="text-align:center;font-size:14px;color:var(--mu);margin:14px 0 0">Blijf op de stoep · Kleintjes met een volwassene · Zeg dankjewel 🙏</p></div>`
 makeMap(false);}

async function datum(){
 app.innerHTML=`<h2>📅 Welke dag past?</h2><p class="m">Stem mee over de datum van Halloween in de buurt.</p><div id="pk2" class="empty">Laden…</div>`;
 let o=[],st=[];try{[o,st]=await Promise.all([get("prikker_opties?select=*&order=volgorde"),get("prikker_stemmen?select=optie_id,naam,keuze")])}catch(e){$("#pk2").textContent="Kon niet laden.";return}
 const naam=localStorage.getItem("naam")||"";
 $("#pk2").outerHTML=`${EVENT.prikker===false?'<div class="picked">De datumprikker is gesloten.</div>':`<input id="nm" placeholder="Je naam of huisnummer" value="${esc(naam)}" maxlength="40">`}
 <div class="list" style="margin-top:12px">${o.map(x=>{const s=st.filter(v=>v.optie_id==x.id),c=k=>s.filter(v=>v.keuze==k).length;return `<div class="row" style="flex-wrap:wrap;cursor:default"><span class="t">${esc(x.label)}<small>✅ ${c("ja")} · 🤔 ${c("misschien")} · ❌ ${c("nee")}</small></span>${EVENT.prikker===false?"":`<span class="chips">${[["ja","✅"],["misschien","🤔"],["nee","❌"]].map(([k,e])=>`<button class="chip ${s.some(v=>v.naam==naam&&v.keuze==k)?"on":""}" data-o="${x.id}" data-k="${k}">${e}</button>`).join("")}</span>`}</div>`}).join("")||'<div class="empty">Nog geen opties.</div>'}</div><div class="err" id="err"></div>`;
 app.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{const n=$("#nm").value.trim();if(!n){$("#err").textContent="Vul eerst je naam in.";$("#nm").focus();return}
  try{localStorage.setItem("naam",n)}catch(e){}try{await rpc("stem",{p_optie:b.dataset.o,p_naam:n,p_keuze:b.dataset.k});datum()}catch(m){$("#err").textContent=m}});
}
async function beheer(){
 const k=new URLSearchParams(location.hash.split("?")[1]||"").get("k")||sessionStorage.getItem("bk")||"";
 if(!k){app.innerHTML='<div class="empty">Geen toegang.</div>';return}
 let lijst;try{lijst=await rpc("beheer_lijst",{p_key:k});sessionStorage.setItem("bk",k)}catch(m){app.innerHTML=`<div class="empty">${esc(m)}</div>`;return}
 const [o,st]=await Promise.all([get("prikker_opties?select=*&order=volgorde"),get("prikker_stemmen?select=optie_id,keuze")]);
 const nieuw=lijst.filter(h=>!h.goedgekeurd),ok=lijst.filter(h=>h.goedgekeurd);
 const rij=h=>`<div class="row" style="flex-wrap:wrap;cursor:default"><span class="e">${TYPES[h.type][0]}</span><span class="t">${esc(h.adres)}<small>${TYPES[h.type][1]}${h.extra.length?" · "+h.extra.map(esc).join(" · "):""}</small></span>
  <span class="chips">${h.goedgekeurd?`<button class="chip" data-a="afkeuren" data-id="${h.id}">Verbergen</button>`:`<button class="chip on" data-a="goedkeuren" data-id="${h.id}">✓ Goedkeuren</button>`}
  <select class="chip" data-type="${h.id}">${Object.entries(TYPES).map(([t,[e,n]])=>`<option value="${t}" ${t==h.type?"selected":""}>${e} ${n}</option>`).join("")}</select>
  <button class="chip" data-a="verwijderen" data-id="${h.id}">🗑️</button></span></div>`;
 app.innerHTML=`<h2>🔧 Beheer</h2>
 <h2>Nieuw (${nieuw.length})</h2><div class="list">${nieuw.map(rij).join("")||'<div class="empty">Niets te controleren.</div>'}</div>
 <h2>Op de kaart (${ok.length})</h2><div class="list">${ok.map(rij).join("")||'<div class="empty">Nog niets.</div>'}</div>
 <h2>📍 Gebied (postcodes)</h2><p class="m">Alle adressen met deze postcodes kunnen meedoen. Zoek postcodes op via <a href="https://allecijfers.nl/postcodekaart/?lon=4.4921&lat=51.9861&zoom=16" target="_blank" style="color:var(--or)">postcodekaart</a>. Gescheiden met komma's of spaties.</p><textarea id="bpc" rows="5" style="width:100%;background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:14px;font:16px Inter,sans-serif">${esc((EVENT.postcodes||[]).join(", "))}</textarea><button class="btn ghost" id="bpcs">Gebied opslaan</button><p class="m" style="margin-top:6px">Nu ${LOTS.length} adressen in het gebied.</p>
 <h2>Evenement</h2><input id="bd" value="${esc(EVENT.datum)}" placeholder="Datum"><input id="bt" value="${esc(EVENT.tijd)}" placeholder="Tijd"><input id="bm" value="${esc(EVENT.mededeling||"")}" placeholder="Mededeling (optioneel)">
 <label class="chips" style="margin-top:10px"><button class="chip ${EVENT.prikker!==false?"on":""}" id="bp">📅 Datumprikker open</button></label>
 <button class="btn" id="bs">Opslaan</button>
 <h2>Datumprikker</h2><div class="list">${o.map(x=>{const s=st.filter(v=>v.optie_id==x.id),c=q=>s.filter(v=>v.keuze==q).length;return `<div class="row" style="cursor:default"><span class="t">${esc(x.label)}<small>✅ ${c("ja")} · 🤔 ${c("misschien")} · ❌ ${c("nee")}</small></span><button class="chip" data-del="${x.id}">🗑️</button></div>`}).join("")}</div>
 <input id="bo" placeholder="Nieuwe optie, bijv. Zaterdag 31 oktober 17:00–20:00"><button class="btn ghost" id="bad">Optie toevoegen</button><div class="err" id="err"></div>`;
 const doe=async(f,b)=>{try{await rpc(f,{p_key:k,...b});await laad();beheer()}catch(m){$("#err").textContent=m}};
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(b.dataset.a=="verwijderen"&&!confirm("Verwijderen?"))return;doe("beheer_huis",{p_id:b.dataset.id,p_actie:b.dataset.a})});
 app.querySelectorAll("[data-type]").forEach(s=>s.onchange=()=>doe("beheer_huis",{p_id:s.dataset.type,p_actie:"bewerken",p_type:s.value}));
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>doe("beheer_optie",{p_label:"",p_verwijder:b.dataset.del}));
 $("#bp").onclick=()=>$("#bp").classList.toggle("on");
 $("#bpcs").onclick=async()=>{const l=$("#bpc").value.toUpperCase().split(/[\s,;]+/).map(x=>x.trim()).filter(x=>/^\d{4}[A-Z]{2}$/.test(x));try{$("#bpcs").textContent="Laden…";await rpc("beheer_postcodes",{p_key:k,p_postcodes:l});await laad();await laadGebied(EVENT.postcodes);beheer()}catch(m){$("#err").textContent=m}};
 $("#bs").onclick=()=>doe("beheer_instellingen",{p_datum:$("#bd").value,p_tijd:$("#bt").value,p_mededeling:$("#bm").value,p_prikker_open:$("#bp").classList.contains("on")});
 $("#bad").onclick=()=>{const v=$("#bo").value.trim();if(v)doe("beheer_optie",{p_label:v})};
}
function route(){$(".sheet")?.remove();if(MAP){MAP.remove();MAP=null}const p=(location.hash||"#/").slice(2).split("?")[0];
 document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t==p));
 ({meedoen,flyer,datum,beheer}[p]||kaart)();scrollTo(0,0)}
addEventListener("hashchange",route);
app.innerHTML='<div class="empty">Kaart laden…</div>';laad().then(()=>laadGebied(EVENT.postcodes||[])).then(()=>{route();georef().then(ok=>{const p=(location.hash||"#/").slice(2).split("?")[0];if(ok&&["","meedoen","flyer"].includes(p))route()})});
</script></body></html>
