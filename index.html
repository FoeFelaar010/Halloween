<style>
:root{--bg:#16101f;--card:#221a2e;--line:#352a45;--or:#ff7a1a;--tx:#f5f1fa;--mu:#a99bbd;--ok:#2fbf6b;--tabh:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
h1{font-family:Creepster,cursive;font-weight:400;color:var(--or);margin:0;letter-spacing:1px}
h2{font-size:20px;margin:18px 0 6px}p.m{color:var(--mu);margin:0 0 12px;font-size:15px}
main{max-width:600px;margin:0 auto;padding:12px 16px 28px}
main.full{max-width:none;padding:0}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;background:#1d1528f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom);z-index:1000}
.tabs a{flex:1;text-align:center;color:var(--mu);text-decoration:none;font-size:12px;font-weight:600;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;justify-content:center}
.tabs a b{font-size:22px;line-height:1.15}
.tabs a.on{color:var(--tx);background:var(--card)}
/* home */
.hero{text-align:center;padding:28px 8px 10px}.hero h1{font-size:46px;line-height:1.05}
.hero .when{display:inline-block;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}

.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.big a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;min-height:132px}
.big a b{font-size:38px;line-height:1}.big a span{font-weight:800;font-size:18px}.big a small{color:var(--mu);font-size:13px;line-height:1.3}
.big a.main{grid-column:1/-1;background:linear-gradient(135deg,#ff7a1a,#c2410c);border:0;color:#1a0b00;min-height:120px}.big a.main small{color:#3b1600}
.note{background:#3a2410;border:1px solid #7a3d10;border-radius:16px;padding:12px 14px;margin-top:14px}
.stat{display:flex;gap:10px;margin-top:14px}.stat div{flex:1;background:var(--card);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:26px;color:var(--or)}.stat small{color:var(--mu)}
/* kaartpagina */
.kp{position:relative;height:calc(100dvh - var(--tabh) - env(safe-area-inset-bottom))}
.kp .map{position:absolute;inset:0}
.side{display:none}
.lmap{width:100%;height:100%;background:#d9d4cc}
.leaflet-container{font-family:Inter,system-ui,sans-serif}
.ctl{position:absolute;right:12px;z-index:600;display:flex;flex-direction:column;gap:8px}
.ctl button,.lay{background:#fff;color:#202124;border:0;border-radius:14px;box-shadow:0 2px 10px #0005;font:700 14px Inter,sans-serif}
.ctl button{width:48px;height:48px;font-size:22px;cursor:pointer}
.ctl button.on{background:#1a73e8;color:#fff}
.lay{position:absolute;top:12px;right:12px;z-index:600;display:flex;overflow:hidden}
.lay button{border:0;background:#fff;color:#3c4043;font:700 13px Inter,sans-serif;padding:10px 12px;cursor:pointer}.lay button.on{background:#e8f0fe;color:#1a73e8}
.mk{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;box-shadow:0 2px 6px #0008;border:3px solid var(--or);transition:transform .15s}
.mk.hl{transform:scale(1.35);box-shadow:0 0 0 6px #ff7a1a77,0 2px 6px #0008}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 8px #1a73e844,0 1px 4px #0008}
.num{background:none;border:0;box-shadow:none;color:#c2410c;font:800 14px Inter,sans-serif;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;padding:0}
.num:before{display:none}.sat .num{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.hidenum .num{display:none}
.legend{display:flex;gap:12px;justify-content:center;color:var(--mu);font-size:13px;flex-wrap:wrap}
/* lijst / bottom sheet */
.list{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.row:first-child{border-top:0}.row:hover{background:#2c2240}.row .e{font-size:24px;width:30px;text-align:center}.row .t{flex:1}.row small{display:block;color:var(--mu);font-size:13px}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:700;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #0008;max-height:16vh;transition:max-height .25s;display:flex;flex-direction:column}
.drawer.open{max-height:62vh}
.drawer .hd{padding:10px 16px 12px;cursor:pointer;text-align:center}.drawer .hd:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.drawer .hd b{font-size:17px}.drawer .hd small{display:block;color:var(--mu)}
.drawer .bd{overflow:auto;padding:0 12px 12px}
.empty{color:var(--mu);text-align:center;padding:24px}
/* sheet huis */
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:#fff;color:#1d1528;border-radius:22px;padding:16px 18px;box-shadow:0 10px 40px #000c;z-index:1100}

.sheet p{margin:6px 0 0;color:#4d4060}.sheet .btn{margin-top:12px;padding:13px}
/* formulieren */
.step{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:700}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--or);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px}
.picked{background:var(--card);border-radius:14px;padding:14px 16px;font-weight:600;min-height:52px;margin-top:10px}
.picked.ok{background:var(--ok);color:#06210f}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:2px solid transparent;border-radius:16px;padding:16px 4px;text-align:center;color:var(--tx);font:600 14px Inter,sans-serif;cursor:pointer}
.tile b{display:block;font-size:30px;line-height:1.3}.tile.on{border-color:var(--or);background:#3a2410}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid transparent;color:var(--tx);border-radius:999px;padding:10px 14px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--or);background:#3a2410}
input,textarea,select{width:100%;background:var(--card);border:2px solid transparent;color:var(--tx);border-radius:14px;padding:14px 16px;font:16px Inter,sans-serif;margin-top:8px;outline:none}
input:focus,textarea:focus{border-color:var(--or)}
.sugg{background:var(--card);border-radius:14px;margin-top:6px;overflow:hidden}.sugg button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--tx);font:600 15px Inter,sans-serif;padding:12px 16px;cursor:pointer}.sugg button:first-child{border-top:0}
.pmap{height:52vh;min-height:340px;border-radius:20px;overflow:hidden;border:1px solid var(--line);position:relative;margin-top:10px}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--or);color:#1a0e00;font:700 17px Inter,sans-serif;padding:16px;margin-top:20px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--tx)}
.err{color:#ff8a80;font-size:14px;margin-top:8px;min-height:20px}
.done{text-align:center;padding:30px 8px}.done b{font-size:64px;display:block}
/* flyer */
.flyer{background:#16101f;border-radius:16px;padding:18px;border:1px solid var(--line)}
.flyer h1{font-size:42px;text-align:center}
.fmap{height:420px;border-radius:16px;overflow:hidden;margin:12px 0;position:relative}
.fbot{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:start}
.fl{columns:2;column-gap:16px;font-size:13px;margin:0;padding-left:20px}.fl li{margin:2px 0;break-inside:avoid}
.qr{background:#fff;border-radius:12px;padding:8px;text-align:center;color:#1d1528;font-size:11px;font-weight:700}.qr svg{width:100%;height:auto;display:block}
@media print{.tabs,.noprint{display:none!important}body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}main{max-width:none;padding:0}@page{margin:8mm}}

function tok(){let t="";try{t=localStorage.getItem("stemtoken")||""}catch(e){}if(!/^[a-f0-9]{32}$/.test(t)){t=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("stemtoken",t)}catch(e){}}return t}
function optDag(x){return x.dag?dagTxt(x.dag):esc(x.label)}
function optTijd(x){return x.van?tijdTxt(x.van,x.tot)+" uur":""}
function voorbij(x){return x.dag&&x.dag<new Date().toISOString().slice(0,10)}
const KEUZES=[["ja","✅","Kan ik"],["misschien","🤔","Misschien"],["nee","❌","Kan niet"]];
function stemVenster(){const v=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Amsterdam"}),s=EVENT.pstart,e=EVENT.pend;
 const kort=d=>new Date(d+"T12:00").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"long"})+jr(d);
 if(EVENT.prikker===false)return{open:false,st:"dicht",txt:"",kort:""};
 if(s&&v<s)return{open:false,st:"voor",txt:`⏳ Stemmen start op <b>${kort(s)}</b>${e?` en kan t/m <b>${kort(e)}</b>`:""}.`,kort:`Stemmen vanaf ${kort(s)}`};
 if(e&&v>e)return{open:false,st:"na",txt:`🔒 Stemmen kon t/m <b>${kort(e)}</b>. De organisatie kiest nu de datum.`,kort:"Stemmen is gesloten"};
 const n=e?Math.round((Date.parse(e)-Date.parse(v))/864e5)+1:0;
 return{open:true,st:"open",txt:e?`🗳️ Stemmen kan ${s?`van <b>${kort(s)}</b> `:""}t/m <b>${kort(e)}</b> · ${n<=1?"<b>laatste dag!</b>":`nog <b>${n} dagen</b>`}`:"",kort:e?`Stemmen kan t/m ${kort(e)}`:"Stem mee over de datum"}}
async function datum(){
 app.className="";
 app.innerHTML=`<h2>📅 Welke dag past?</h2><div id="pk2" class="empty">Laden…</div>`;
 let o=[],st=[];try{[o,st]=await Promise.all([get("prikker_opties?select=*&order=dag,van,volgorde"),rpc("prikker_stand",{p_token:tok()})])}catch(e){$("#pk2").textContent="Kon de datumprikker niet laden. Probeer het later opnieuw.";return}
 const S={};(st||[]).forEach(s=>S[s.optie_id]=s);
 const SV=stemVenster(),open=SV.open;
 const teken=()=>{
  const rows=o.map(x=>({x,s:S[x.id]||{ja:0,misschien:0,nee:0,mijn:null}}));
  const score=r=>r.s.ja*2+r.s.misschien, top=Math.max(0,...rows.map(score));
  const klaar=rows.filter(r=>r.s.mijn).length;
  $("#pk").innerHTML=`${!open?`<div class="pinfo">${EVENT.datum?`🎃 <b>De datum staat vast: ${esc(EVENT.datum)}${EVENT.tijd?" · "+esc(EVENT.tijd):""}</b>`:(SV.txt||"🔒 De datumprikker is gesloten.")}${agendaHTML()}${o.length&&SV.st!="voor"?"<small>Hieronder zie je hoe er gestemd is.</small>":""}</div>`
   :`${SV.txt?`<div class="svbalk">${SV.txt}</div>`:""}<div class="pinfo">Tik per dag aan of je kunt. Je stem is <b>anoniem</b> en je kunt hem altijd aanpassen.<br><small>${klaar?`✔️ Je hebt ${klaar} van de ${rows.length} dagen ingevuld.`:"Je hebt nog niet gestemd."}</small></div>`}
  ${rows.map(({x,s})=>{const n=s.ja+s.misschien+s.nee,lead=top>0&&score({s})==top,oud=voorbij(x);
   return `<div class="popt ${lead?"lead":""} ${oud?"oud":""}">
    <div class="ph"><div><b>${optDag(x)}</b>${optTijd(x)?`<small>🕖 ${optTijd(x)}</small>`:""}</div>${lead?`<span class="badge">⭐ ${open?"Favoriet":"Meeste stemmen"}</span>`:""}</div>
    <div class="pbar">${n?`<i class="j" style="flex:${s.ja}"></i><i class="m" style="flex:${s.misschien}"></i><i class="n" style="flex:${s.nee}"></i>`:""}</div>
    <div class="pcnt"><span>✅ ${s.ja} kan</span><span>🤔 ${s.misschien} misschien</span><span>❌ ${s.nee} kan niet</span></div>
    ${open&&!oud?`<div class="pk3">${KEUZES.map(([k,e,t])=>`<button class="pkb ${k} ${s.mijn==k?"on":""}" data-o="${x.id}" data-k="${k}" aria-pressed="${s.mijn==k}"><span>${e}</span>${t}</button>`).join("")}</div>`:""}
   </div>`}).join("")||'<div class="empty">Er zijn nog geen datums om uit te kiezen.</div>'}
  <div class="err" id="err"></div>`;
  bindAgenda();
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{
   const id=b.dataset.o,k=b.dataset.k,s=S[id]||(S[id]={ja:0,misschien:0,nee:0,mijn:null}),oud=s.mijn,nieuw=oud==k?null:k;
   if(oud)s[oud]--;if(nieuw)s[nieuw]++;s.mijn=nieuw;teken();
   try{await rpc("stem",{p_optie:id,p_token:tok(),p_keuze:nieuw});toast(nieuw?"Opgeslagen ✓":"Stem weggehaald")}
   catch(m){if(nieuw)s[nieuw]--;if(oud)s[oud]++;s.mijn=oud;teken();$("#err").textContent=m}});
 };
 $("#pk2").outerHTML=`<div id="pk"></div>`;teken();
}

  app.querySelectorAll("[data-pv]").forEach(e=>e.oninput=()=>SEL[e.dataset.pv].van=e.value);

function inlog(melding){
 app.className="";
 app.innerHTML=`<div class="login"><div class="lgi">🕸️</div><h2>Beheer</h2><p class="m">Alleen voor de organisatie. Log in met je e-mailadres en wachtwoord.</p>
 ${melding?`<div class="err" style="margin-bottom:8px">${esc(melding)}</div>`:""}
 <form id="lf"><label class="lb">E-mailadres<input id="le" type="email" required autocomplete="username" value="${esc(SESS?SESS.email:"")}"></label>
 <label class="lb">Wachtwoord<input id="lw" type="password" required autocomplete="current-password"></label>
 <button class="btn" id="lgo">Inloggen</button></form>
 <button class="plink" id="lver">Wachtwoord vergeten?</button>${SESS?'<button class="plink" id="luit" style="display:block;margin:6px auto 0">Uitloggen</button>':""}<div class="err" id="lerr"></div></div>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";$("#lgo").disabled=true;$("#lgo").textContent="Bezig…";try{sessZet(await auth("token?grant_type=password",{email:$("#le").value.trim(),password:$("#lw").value}));bhKnop();beheer()}catch(m){$("#lerr").textContent=m;$("#lgo").disabled=false;$("#lgo").textContent="Inloggen"}};
 $("#lver").onclick=async()=>{const e=$("#le").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return $("#lerr").textContent="Vul eerst je e-mailadres in.";try{await auth("recover?redirect_to="+encodeURIComponent(location.origin+location.pathname),{email:e});$("#lerr").style.color="var(--ok)";$("#lerr").textContent="Als dit adres bij ons bekend is, krijg je een mail met een link om een nieuw wachtwoord te kiezen."}catch(m){$("#lerr").textContent=m}};
 if($("#luit"))$("#luit").onclick=()=>{sessZet(null);bhKnop();inlog()};
}

}

let MAILLINK=null;(()=>{const h=location.hash.slice(1);if(!/(^|&)(access_token|error_description)=/.test(h))return;const q=new URLSearchParams(h);history.replaceState(null,"",location.pathname+location.search+"#/beheer");if(q.get("access_token")){sessZet({access_token:q.get("access_token"),refresh_token:q.get("refresh_token"),expires_in:+q.get("expires_in")||3600});MAILLINK={soort:q.get("type")||"recovery"}}else MAILLINK={fout:"Deze link is verlopen of al gebruikt. Vraag een nieuwe aan via 'Wachtwoord vergeten?'."}})();
